<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" width="800" height="402">
  <rect width="800" height="402" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">療養食加算は1回6単位・1日3回までです</text>

    <rect x="40" y="56" width="720" height="108" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="130" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">対象の療養食</text>
    <line x1="220" y1="70" x2="220" y2="150" stroke="#90CAF9" stroke-width="2"/>
    <text x="244" y="82" font-size="14" font-weight="bold" fill="#0F172A">糖尿病食／腎臓病食／肝臓病食／胃潰瘍食／貧血食</text>
    <text x="244" y="108" font-size="12" font-weight="bold" fill="#475569">膵臓病食／脂質異常症食／痛風食／特別な場合の検査食</text>
    <text x="244" y="130" font-size="12" font-weight="bold" fill="#475569">医師の発行する食事箋に基づいて提供されたものであることが前提です</text>
    <rect x="40" y="176" width="720" height="108" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="130" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">体制の要件</text>
    <line x1="220" y1="190" x2="220" y2="270" stroke="#CBD5E1" stroke-width="2"/>
    <text x="244" y="202" font-size="14" font-weight="bold" fill="#0F172A">食事の提供が管理栄養士または栄養士によって管理されていること</text>
    <text x="244" y="228" font-size="12" font-weight="bold" fill="#475569">入所者の年齢・心身の状況に応じた適切な栄養量と内容であること</text>
    <text x="244" y="250" font-size="12" font-weight="bold" fill="#475569">人員基準欠如等に該当しないこと</text>
    <rect x="40" y="304" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="333" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">人員基準を割ると、基本報酬だけでなく療養食加算の前提も崩れます</text>
    <text x="400" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">栄養面で配慮した食事というだけでは当てはまりません。食事箋が要ります</text>
  </g>
</svg>
