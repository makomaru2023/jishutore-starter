<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330">
  <rect width="800" height="330" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">ほぐしてから、声に出して、最後に飲み込みの筋トレ</text>

    <rect x="40" y="56" width="132" height="140" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="64" cy="80" r="13" fill="#1565C0"/>
    <text x="64" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="106" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">深呼吸</text>
    <text x="106" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">呼吸を整える</text>
    <text x="106" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">30秒</text>

    <polygon points="178,113 190,121 178,129" fill="#1565C0"/>

    <rect x="194" y="56" width="132" height="140" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="218" cy="80" r="13" fill="#1565C0"/>
    <text x="218" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="260" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">口と頬</text>
    <text x="260" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">イー・ウー／頬</text>
    <text x="260" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">1分</text>

    <polygon points="332,113 344,121 332,129" fill="#1565C0"/>

    <rect x="348" y="56" width="132" height="140" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="372" cy="80" r="13" fill="#1565C0"/>
    <text x="372" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="414" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">舌</text>
    <text x="414" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">前・上あご・左右</text>
    <text x="414" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">1分30秒</text>

    <polygon points="486,113 498,121 486,129" fill="#1565C0"/>

    <rect x="502" y="56" width="132" height="140" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="526" cy="80" r="13" fill="#1565C0"/>
    <text x="526" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="568" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">パタカラ</text>
    <text x="568" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">各10回ずつ</text>
    <text x="568" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">1分</text>

    <polygon points="640,113 652,121 640,129" fill="#1565C0"/>

    <rect x="656" y="56" width="104" height="140" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="680" cy="80" r="13" fill="#1565C0"/>
    <text x="680" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="708" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">飲み込み</text>
    <text x="708" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">おでこ体操</text>
    <text x="708" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">1分</text>

    <rect x="40" y="216" width="720" height="48" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">配分は僕の組み方です。人数と反応で毎回変わるので、目安として見てください</text>

    <text x="400" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">シャキア訓練は仰臥位で行うので、この座ったままの流れとは分けます</text>
  </g>
</svg>
