<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">形は同じ4点。でも4点目が違う</text>

    <rect x="40" y="56" width="352" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">高齢者虐待防止措置未実施減算</text>
    <text x="216" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">こちらが「4点セット」の形です</text>
    <line x1="72" y1="122" x2="360" y2="122" stroke="#90CAF9" stroke-width="2"/>
    <text x="216" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">① 委員会を定期的に開催して周知</text>
    <text x="216" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">② 指針を整備する</text>
    <text x="216" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">③ 研修を定期的に実施する</text>
    <text x="216" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">④ 担当者を置く</text>

    <rect x="408" y="56" width="352" height="200" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">身体拘束廃止未実施減算</text>
    <text x="584" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">4点目が入れ替わっています</text>
    <line x1="440" y1="122" x2="728" y2="122" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">① 委員会を3月に1回以上開催して周知</text>
    <text x="584" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">② 指針を整備する</text>
    <text x="584" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">③ 研修を定期的に実施する</text>
    <text x="584" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">④ 記録する</text>

    <rect x="40" y="276" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">①〜③は体制の話、④の記録だけそのつど発生します</text>

    <text x="400" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">記録するのは、態様及び時間、その際の入所者の心身の状況、緊急やむを得ない理由</text>
  </g>
</svg>
