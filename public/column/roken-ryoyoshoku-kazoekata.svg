<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">数えるのは「日」ではなく「回」です</text>

    <rect x="40" y="56" width="226" height="150" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="153" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">1回につき</text>
    <text x="153" y="130" text-anchor="middle" font-size="26" font-weight="bold" fill="#0F172A">6単位</text>
    <text x="153" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">療養食を提供した</text>
    <text x="153" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">その1回ぶんです</text>

    <rect x="287" y="56" width="226" height="150" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">1日の上限</text>
    <text x="400" y="130" text-anchor="middle" font-size="26" font-weight="bold" fill="#0F172A">3回まで</text>
    <text x="400" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">1日につき3回を</text>
    <text x="400" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350F">限度として加算します</text>

    <rect x="534" y="56" width="226" height="150" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="647" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">1日でいちばん多いとき</text>
    <text x="647" y="130" text-anchor="middle" font-size="26" font-weight="bold" fill="#0F172A">18単位</text>
    <text x="647" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">6単位が3回そろった</text>
    <text x="647" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">日の合計です</text>

    <rect x="40" y="226" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">提供しなかった食事の回は、数に入りません</text>

    <text x="400" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">「1日につき」の加算と混ぜると、月の見込みがずれます</text>
  </g>
</svg>
