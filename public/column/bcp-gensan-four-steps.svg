<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">「策定した」だけでは終わらない</text>

    <!-- 4ステップ -->
    <rect x="22" y="52" width="170" height="118" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="107" cy="84" r="17" fill="#1565C0"/>
    <text x="107" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="107" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">業務継続計画を</text>
    <text x="107" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">策定する</text>

    <rect x="216" y="52" width="170" height="118" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="301" cy="84" r="17" fill="#1565C0"/>
    <text x="301" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="301" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">従業者へ</text>
    <text x="301" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">周知する</text>

    <rect x="410" y="52" width="170" height="118" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <circle cx="495" cy="84" r="17" fill="#B45309"/>
    <text x="495" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="495" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">研修と訓練を</text>
    <text x="495" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">定期的に行う</text>

    <rect x="604" y="52" width="170" height="118" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <circle cx="689" cy="84" r="17" fill="#B45309"/>
    <text x="689" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="689" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">定期的に見直し、</text>
    <text x="689" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">必要なら変更する</text>

    <path d="M194 111 L212 111" stroke="#94A3B8" stroke-width="2"/>
    <path d="M212 111 l-8 -5 v10 z" fill="#94A3B8"/>
    <path d="M388 111 L406 111" stroke="#94A3B8" stroke-width="2"/>
    <path d="M406 111 l-8 -5 v10 z" fill="#94A3B8"/>
    <path d="M582 111 L600 111" stroke="#94A3B8" stroke-width="2"/>
    <path d="M600 111 l-8 -5 v10 z" fill="#94A3B8"/>

    <!-- 減算の重さ -->
    <rect x="22" y="196" width="752" height="66" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
    <text x="398" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#B71C1C">満たさないとき</text>
    <text x="398" y="248" text-anchor="middle" font-size="17" font-weight="bold" fill="#B71C1C">所定単位数から一定割合が減算される（基本報酬そのものにかかる）</text>

    <rect x="22" y="278" width="752" height="80" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="398" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">加算の取りこぼしは「増えなかった」で済むが、</text>
    <text x="398" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">減算は「これまで取れていた分が減る」。効き方が違う。</text>
  </g>
</svg>
