<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">長く続けるほど減り、次へ渡すと増えます</text>

    <rect x="40" y="56" width="345" height="230" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="212" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350F">減る側</text>
    <text x="212" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">介護予防訪問リハの長期利用減算</text>
    <text x="212" y="156" text-anchor="middle" font-size="26" font-weight="bold" fill="#B45309">−30単位/回</text>
    <line x1="70" y1="178" x2="355" y2="178" stroke="#CBD5E1" stroke-width="2"/>
    <text x="212" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">利用開始月から12月を超えて提供し</text>
    <text x="212" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">要件を満たさない場合</text>
    <text x="212" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">改正前は5単位。令和6年度改定で6倍に</text>
    <text x="212" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">要件＝リハ会議の実施とLIFE提出</text>

    <rect x="415" y="56" width="345" height="230" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="587" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1565C0">増える側</text>
    <rect x="440" y="102" width="295" height="48" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="2"/>
    <text x="587" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">訪問リハ・移行支援加算</text>
    <text x="587" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">17単位/日</text>
    <rect x="440" y="158" width="295" height="48" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="2"/>
    <text x="587" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">通所リハ・移行支援加算</text>
    <text x="587" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">12単位/日</text>
    <rect x="440" y="214" width="295" height="48" rx="8" fill="#FFFFFF" stroke="#90CAF9" stroke-width="2"/>
    <text x="587" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">介護予防訪問リハ・事業所評価加算</text>
    <text x="587" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">120単位/月</text>

    <rect x="40" y="304" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="333" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">続けることより、次のサービスへ渡すことを評価する向きになっています</text>

    <text x="400" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">12月超減算は介護予防の仕組みです。要介護の訪問リハビリテーション費には設定されていません</text>
  </g>
</svg>
