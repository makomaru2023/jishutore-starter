<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">(Ⅰ)(Ⅱ)に共通する3つ</text>

    <rect x="40" y="56" width="226" height="150" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="153" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">① 対象者の割合</text>
    <text x="153" y="124" text-anchor="middle" font-size="22" font-weight="bold" fill="#0F172A">2分の1以上</text>
    <text x="153" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">周囲の者による日常生活に</text>
    <text x="153" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">対する注意を必要とする人</text>

    <rect x="287" y="56" width="226" height="150" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">② 評価して測る</text>
    <text x="400" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">対象者ごとに行動・心理</text>
    <text x="400" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">症状の評価を計画的に行い</text>
    <text x="400" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">評価に基づく値を測定する</text>

    <rect x="534" y="56" width="226" height="150" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="647" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">③ 回し続ける</text>
    <text x="647" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">カンファレンス、計画の作成</text>
    <text x="647" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">定期的な評価、振り返り</text>
    <text x="647" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">計画の見直し等</text>

    <rect x="40" y="226" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">狙いは、行動・心理症状の予防と出現時の早期対応です</text>

    <text x="400" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">①の割合が届かないと、研修を修了した人がいても算定できません</text>
  </g>
</svg>
