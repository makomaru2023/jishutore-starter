<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 498" width="800" height="498">
  <rect width="800" height="498" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">どこから来たかで、1日あたりの上乗せが3倍以上違います</text>

    <rect x="40" y="56" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="150" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">老健から</text>
    <text x="150" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">いちばん高い</text>
    <line x1="270" y1="70" x2="270" y2="126" stroke="#90CAF9" stroke-width="2"/>
    <text x="294" y="84" font-size="14" font-weight="bold" fill="#0F172A">緊急入院＝590点／それ以外＝410点</text>
    <text x="294" y="110" font-size="12" font-weight="bold" fill="#475569">介護老人保健施設から入院した場合です</text>

    <rect x="40" y="152" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="150" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">自宅・施設から</text>
    <text x="150" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">意思決定の支援つき</text>
    <line x1="270" y1="166" x2="270" y2="222" stroke="#90CAF9" stroke-width="2"/>
    <text x="294" y="180" font-size="14" font-weight="bold" fill="#0F172A">緊急入院＝490点／それ以外＝310点</text>
    <text x="294" y="206" font-size="12" font-weight="bold" fill="#475569">介護医療院・特養・軽費・有料老人ホーム等または自宅から</text>

    <rect x="40" y="248" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="150" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">他院の急性期から</text>
    <text x="150" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">病床規模で変わる</text>
    <line x1="270" y1="262" x2="270" y2="318" stroke="#CBD5E1" stroke-width="2"/>
    <text x="294" y="276" font-size="14" font-weight="bold" fill="#0F172A">400床未満＝250点／400床以上＝150点</text>
    <text x="294" y="302" font-size="12" font-weight="bold" fill="#475569">急性期医療を担う他の保険医療機関の一般病棟から転院</text>

    <rect x="40" y="344" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="150" y="382" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">自院の中から</text>
    <text x="150" y="404" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">いちばん低い</text>
    <line x1="270" y1="358" x2="270" y2="414" stroke="#CBD5E1" stroke-width="2"/>
    <text x="294" y="372" font-size="14" font-weight="bold" fill="#0F172A">400床未満＝125点／400床以上＝50点</text>
    <text x="294" y="398" font-size="12" font-weight="bold" fill="#475569">同じ病院の一般病棟からの転棟です</text>

    <rect x="40" y="440" width="720" height="42" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="467" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">どれも入院した日から起算して14日が限度です</text>
  </g>
</svg>
