<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330">
  <rect width="800" height="330" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">続かないときに変えるのは、本人ではなく渡し方です</text>

    <rect x="40" y="56" width="226" height="160" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="66" cy="82" r="14" fill="#1565C0"/>
    <text x="66" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="153" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0F172A">減らす</text>
    <text x="153" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">種目は3つまで</text>
    <text x="153" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">多いと全部やらない</text>

    <rect x="287" y="56" width="226" height="160" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="313" cy="82" r="14" fill="#1565C0"/>
    <text x="313" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="400" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0F172A">いつやるか決める</text>
    <text x="400" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">時間ではなく</text>
    <text x="400" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">いまある習慣にくっつける</text>

    <rect x="534" y="56" width="226" height="160" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="560" cy="82" r="14" fill="#1565C0"/>
    <text x="560" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="647" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#0F172A">できたか分かる形</text>
    <text x="647" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">紙の上で印がつく</text>
    <text x="647" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">次に会うとき話題にする</text>

    <rect x="40" y="236" width="720" height="48" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">3つとも、渡す前に決められることです</text>

    <text x="400" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">やる気を上げようとするより、迷いどころを先に減らすほうが早いです</text>
  </g>
</svg>
