<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">急性期で退院が早いのは、3か所で効いているからです</text>

    <rect x="40" y="56" width="720" height="64" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="165" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">病棟の施設基準</text>
    <line x1="290" y1="68" x2="290" y2="108" stroke="#90CAF9" stroke-width="2"/>
    <text x="314" y="88" font-size="14" font-weight="bold" fill="#0F172A">平均在院日数21日以内</text>
    <text x="314" y="108" font-size="11" font-weight="bold" fill="#475569">急性期病院A一般入院料・急性期一般入院料1は16日以内</text>

    <rect x="40" y="134" width="720" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="165" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">入院からの日数</text>
    <line x1="290" y1="146" x2="290" y2="186" stroke="#CBD5E1" stroke-width="2"/>
    <text x="314" y="166" font-size="14" font-weight="bold" fill="#0F172A">14日以内は450点／日、15〜30日は192点／日</text>
    <text x="314" y="186" font-size="11" font-weight="bold" fill="#475569">31日目からは対象外になります</text>

    <rect x="40" y="212" width="720" height="64" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="165" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">90日を超えたら</text>
    <line x1="290" y1="224" x2="290" y2="264" stroke="#FCD34D" stroke-width="2"/>
    <text x="314" y="244" font-size="14" font-weight="bold" fill="#0F172A">注1から注10にかかわらず</text>
    <text x="314" y="264" font-size="11" font-weight="bold" fill="#475569">療養病棟入院料1の例により算定します</text>

    <rect x="40" y="296" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">1つ目は病棟全体の話、2つ目と3つ目はその方ひとりの話です</text>

    <text x="400" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">実際の請求では、原本と地方厚生局への確認を優先してください</text>
  </g>
</svg>
