<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">(Ⅰ)が見ているのは、施設がどこから来たか</text>

    <rect x="40" y="56" width="352" height="184" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">転換前が　介護療養型医療施設</text>
    <line x1="72" y1="102" x2="360" y2="102" stroke="#90CAF9" stroke-width="2"/>
    <text x="216" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">療養型介護療養施設サービス費(Ⅰ)等を</text>
    <text x="216" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">算定する指定介護療養型医療施設を</text>
    <text x="216" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">有する病院であった老健</text>
    <text x="216" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">これに当てはまるか</text>

    <rect x="408" y="56" width="352" height="184" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">転換前が　療養病床を有する病院</text>
    <line x1="440" y1="102" x2="728" y2="102" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">療養病床を有する病院であった老健</text>
    <text x="584" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">（20対1配置病棟等を有するものに</text>
    <text x="584" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">限る、と括弧書きが付いています）</text>
    <text x="584" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">または、これに当てはまるか</text>

    <rect x="40" y="260" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="289" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">施設基準は「次のいずれかに該当すること」</text>

    <text x="400" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">どちらも転換前の話です。あとから満たしにいける要件ではありません</text>
  </g>
</svg>
