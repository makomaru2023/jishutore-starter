<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 594" width="800" height="594">
  <rect width="800" height="594" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">医科は「どこがどう足りないか」で率が変わります</text>

    <rect x="40" y="56" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="115" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">−5%</text>
    <text x="115" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">いちばん軽い</text>
    <line x1="190" y1="70" x2="190" y2="126" stroke="#90CAF9" stroke-width="2"/>
    <text x="214" y="82" font-size="14" font-weight="bold" fill="#0F172A">夜間看護体制特定日減算（所定点数の100分の5を減算）</text>
    <text x="214" y="108" font-size="12" font-weight="bold" fill="#475569">年6日以内かつ連続2月以内を、いずれも満たす特定日が対象です</text>
    <rect x="40" y="152" width="720" height="60" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="115" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">92%</text>
    <line x1="190" y1="166" x2="190" y2="198" stroke="#90CAF9" stroke-width="2"/>
    <text x="214" y="178" font-size="14" font-weight="bold" fill="#0F172A">退院日集中の減算・入退院日集中の減算（所定点数の100分の92）</text>
    <rect x="40" y="224" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="115" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">−15%</text>
    <line x1="190" y1="238" x2="190" y2="294" stroke="#90CAF9" stroke-width="2"/>
    <text x="214" y="250" font-size="14" font-weight="bold" fill="#0F172A">月平均夜勤時間超過減算（所定点数から100分の15を減算）</text>
    <text x="214" y="276" font-size="12" font-weight="bold" fill="#475569">施設基準の一部に適合しなくなった後の直近3月に限ります</text>
    <rect x="40" y="320" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="115" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">85%・90%</text>
    <line x1="190" y1="334" x2="190" y2="390" stroke="#CBD5E1" stroke-width="2"/>
    <text x="214" y="346" font-size="14" font-weight="bold" fill="#0F172A">地域包括ケア病棟で施設基準の一部に適合しなくなった場合</text>
    <text x="214" y="372" font-size="12" font-weight="bold" fill="#475569">入院料2・4は100分の85／入院料3・入院医療管理料3・4は100分の90</text>
    <rect x="40" y="416" width="720" height="60" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="115" y="452" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">70%</text>
    <text x="115" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">いちばん重い</text>
    <line x1="190" y1="430" x2="190" y2="462" stroke="#CBD5E1" stroke-width="2"/>
    <text x="214" y="442" font-size="14" font-weight="bold" fill="#0F172A">夜勤時間特別入院基本料（所定点数の100分の70）</text>
    <rect x="40" y="496" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">特別入院基本料704点は減算ではなく、独立した別建ての点数です</text>
    <text x="400" y="576" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">介護は一律70%、医科は5%から70%まで。同じ「基準を満たさない」でも扱いが違います</text>
  </g>
</svg>
