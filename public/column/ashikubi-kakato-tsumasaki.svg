<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392">
  <rect width="800" height="392" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">かかと上げとつま先上げは、役割が逆です</text>

    <rect x="40" y="56" width="352.5" height="220" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="216.25" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">かかと上げ</text>
    <text x="216.25" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">つま先は床につけたまま</text>
    <text x="216.25" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">ふくらはぎを使う</text>
    <line x1="60" y1="156" x2="372.5" y2="156" stroke="#CBD5E1" stroke-width="2"/>
    <text x="216.25" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">歩行時の蹴り出しの改善</text>
    <text x="216.25" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">長時間座位によるむくみ予防</text>
    <text x="216.25" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">下腿の筋力低下に</text>
    <text x="216.25" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">反動を使わずゆっくり動かします</text>
    <rect x="407.5" y="56" width="352.5" height="220" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="583.75" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">つま先上げ</text>
    <text x="583.75" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">かかとは浮かさない</text>
    <text x="583.75" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">すねの前を使う</text>
    <line x1="427.5" y1="156" x2="740" y2="156" stroke="#90CAF9" stroke-width="2"/>
    <text x="583.75" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">つまずき予防・すり足</text>
    <text x="583.75" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">下垂足</text>
    <text x="583.75" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">脳卒中後の前脛骨筋の活性化</text>
    <text x="583.75" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">ゆっくり下ろすようにします</text>
    <rect x="40" y="294" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">つまずきが気になるときに選ぶのは、つま先上げのほうです</text>
    <text x="400" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">足が上がりきらず床に引っかかるのがつまずき。かかと上げは蹴り出しの運動なので直接は効きません</text>
  </g>
</svg>
