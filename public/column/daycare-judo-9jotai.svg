<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">医療的な処置がある方も、デイケアには通えます</text>

    <rect x="40" y="56" width="720" height="72" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="165" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">対象</text>
    <line x1="290" y1="68" x2="290" y2="116" stroke="#90CAF9" stroke-width="2"/>
    <text x="314" y="86" font-size="15" font-weight="bold" fill="#0F172A">要介護3・4・5で、告示が定める状態にある方</text>
    <text x="314" y="110" font-size="11" font-weight="bold" fill="#475569">計画的な医学的管理のもとで行った場合、1日100単位</text>

    <rect x="40" y="148" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="156" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">常時頻回の喀痰吸引</text>
    <rect x="284" y="148" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">人工呼吸器の使用</text>
    <rect x="528" y="148" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="644" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">中心静脈注射</text>

    <rect x="40" y="200" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="156" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">人工腎臓かつ重篤な合併症</text>
    <rect x="284" y="200" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">常時のモニター測定</text>
    <rect x="528" y="200" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="644" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">ストーマの処置</text>

    <rect x="40" y="252" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="156" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">経鼻胃管や胃瘻等の経腸栄養</text>
    <rect x="284" y="252" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">褥瘡の治療</text>
    <rect x="528" y="252" width="232" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="644" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">気管切開</text>

    <rect x="40" y="316" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">1時間以上2時間未満の区分では算定しません</text>

    <text x="400" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">状態は告示で定められています。個別の判断は原本と保険者への確認を優先してください</text>
  </g>
</svg>
