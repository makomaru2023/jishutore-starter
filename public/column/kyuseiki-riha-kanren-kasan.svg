<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" width="800" height="366">
  <rect width="800" height="366" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">急性期の病棟で別に取れる、リハ職に関わる加算</text>

    <rect x="40" y="56" width="354" height="40" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="217" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">リハビリテーション・栄養・口腔連携体制加算</text>
    <rect x="406" y="56" width="354" height="40" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="583" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">急性期看護補助体制加算</text>

    <rect x="40" y="104" width="354" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="217" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">看護職員夜間配置加算</text>
    <rect x="406" y="104" width="354" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="583" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">術後疼痛管理チーム加算</text>

    <rect x="40" y="152" width="354" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="217" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">入退院支援加算</text>
    <rect x="406" y="152" width="354" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="583" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">排尿自立支援加算</text>

    <rect x="40" y="200" width="354" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="217" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">認知症ケア加算</text>
    <rect x="406" y="200" width="354" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="583" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">せん妄ハイリスク患者ケア加算</text>

    <rect x="40" y="260" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">90日を超えると、注1から注10にかかわらず療養病棟入院料1の例になります</text>

    <text x="400" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">加算ごとに、算定できる入院料の区分が決まっているものがあります</text>
  </g>
</svg>
