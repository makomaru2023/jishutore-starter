<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392">
  <rect width="800" height="392" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">包括と出来高は「定食」と「単品」の違いです</text>

    <rect x="40" y="56" width="352.5" height="220" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216.25" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">出来高</text>
    <text x="216.25" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">急性期一般病棟など</text>
    <text x="216.25" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">やった分を積み上げる</text>
    <line x1="60" y1="156" x2="372.5" y2="156" stroke="#90CAF9" stroke-width="2"/>
    <text x="216.25" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">入院基本料に加えて</text>
    <text x="216.25" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">疾患別リハビリテーション料を算定できる</text>
    <text x="216.25" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">ただし算定できる入院基本料等加算は</text>
    <text x="216.25" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">告示に列挙されたものに限られる</text>
    <rect x="407.5" y="56" width="352.5" height="220" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="583.75" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">包括</text>
    <text x="583.75" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">地域包括ケア病棟など</text>
    <text x="583.75" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">原則ぜんぶ込み</text>
    <line x1="427.5" y1="156" x2="740" y2="156" stroke="#CBD5E1" stroke-width="2"/>
    <text x="583.75" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">診療に係る費用は入院料に含まれる</text>
    <text x="583.75" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">リハビリテーションの費用も含まれる</text>
    <text x="583.75" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">別に算定できるリハビリテーションは</text>
    <text x="583.75" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">摂食機能療法だけ</text>
    <rect x="40" y="294" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">包括でも例外は必ず列挙されています。その一覧を見るのがいちばん早い道です</text>
    <text x="400" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">地域包括ケア病棟では、認知症ケア加算・排尿自立支援加算などは別に算定できます</text>
  </g>
</svg>
