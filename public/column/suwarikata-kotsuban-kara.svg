<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" width="800" height="396">
  <rect width="800" height="396" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">椅子でも車椅子でも、出発点は骨盤です</text>

    <rect x="40" y="56" width="352.5" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216.25" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">椅子</text>
    <text x="216.25" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">椅子での正しい座り方</text>
    <text x="216.25" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">骨盤を立てて深く</text>
    <line x1="60" y1="156" x2="372.5" y2="156" stroke="#90CAF9" stroke-width="2"/>
    <text x="216.25" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">足底をしっかり床につける</text>
    <text x="216.25" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">机の高さや椅子の高さも</text>
    <text x="216.25" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">合わせて見直す</text>
    <rect x="407.5" y="56" width="352.5" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="583.75" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">車椅子</text>
    <text x="583.75" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">車椅子座位姿勢</text>
    <text x="583.75" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">骨盤を起こして</text>
    <line x1="427.5" y1="156" x2="740" y2="156" stroke="#90CAF9" stroke-width="2"/>
    <text x="583.75" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">背もたれに適切に接触させる</text>
    <text x="583.75" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">足をフットレストに乗せる</text>
    <text x="583.75" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">長時間座位では定期的な除圧も</text>
    <text x="400" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">言葉は違いますが、順番は同じです。骨盤が先で、足が次。</text>
    <rect x="40" y="298" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="327" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">「背筋を伸ばして」から入ると、骨盤が寝たまま上半身だけ起きた姿勢になります</text>
    <text x="400" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">骨盤から直すと上は自然についてきます。声かけの順番だけの話ですが、よく効きます</text>
  </g>
</svg>
