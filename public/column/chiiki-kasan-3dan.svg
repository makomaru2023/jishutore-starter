<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">地域の加算は3段。率の順に並びます</text>

    <rect x="40" y="56" width="720" height="90" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="120" y="94" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565C0">+15%</text>
    <text x="120" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">100分の15</text>
    <text x="220" y="90" font-size="16" font-weight="bold" fill="#0F172A">特別地域訪問リハビリテーション加算</text>
    <text x="220" y="120" font-size="13" font-weight="bold" fill="#475569">見るのは事業所の所在地</text>

    <rect x="40" y="158" width="720" height="90" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="120" y="196" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565C0">+10%</text>
    <text x="120" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">100分の10</text>
    <text x="220" y="192" font-size="16" font-weight="bold" fill="#0F172A">中山間地域等における小規模事業所加算</text>
    <text x="220" y="222" font-size="13" font-weight="bold" fill="#475569">見るのは事業所の所在地＋小規模であること</text>

    <rect x="40" y="260" width="720" height="90" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="120" y="298" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565C0">+5%</text>
    <text x="120" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">100分の5</text>
    <text x="220" y="294" font-size="16" font-weight="bold" fill="#0F172A">中山間地域等に居住する者へのサービス提供加算</text>
    <text x="220" y="324" font-size="13" font-weight="bold" fill="#475569">見るのは利用者の居住地＋実施地域を越えたか</text>

    <text x="400" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">上2つは事業所を見る加算、いちばん下だけ利用者を見る加算です</text>
    <text x="400" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">対象となる地域の範囲は、別の告示（厚生労働大臣が定める地域）で確認してください</text>
  </g>
</svg>
