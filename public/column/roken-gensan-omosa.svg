<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356">
  <rect width="800" height="356" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">未実施減算の重さは、同じではありません</text>

    <rect x="40" y="56" width="226" height="170" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="153" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">身体拘束廃止未実施減算</text>
    <text x="153" y="144" text-anchor="middle" font-size="24" font-weight="bold" fill="#0F172A">100分の10</text>
    <text x="153" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350F">3つの中でいちばん重い</text>
    <text x="153" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">委員会は3月に1回以上</text>

    <rect x="287" y="56" width="226" height="170" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">業務継続計画未策定減算</text>
    <text x="400" y="144" text-anchor="middle" font-size="24" font-weight="bold" fill="#0F172A">100分の3</text>
    <text x="400" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">計画を策定すること</text>
    <text x="400" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">計画に従い措置を講じること</text>

    <rect x="534" y="56" width="226" height="170" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="647" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">高齢者虐待防止措置未実施減算</text>
    <text x="647" y="144" text-anchor="middle" font-size="24" font-weight="bold" fill="#0F172A">100分の1</text>
    <text x="647" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">委員会は「定期的に」</text>
    <text x="647" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">担当者を置くこと</text>

    <rect x="40" y="246" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">どれも所定単位数にかかります</text>

    <text x="400" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">老健にはもう1つ栄養管理減算があります。こちらは率ではなく1日14単位です</text>
  </g>
</svg>
