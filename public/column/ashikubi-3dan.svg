<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 522" width="800" height="522">
  <rect width="800" height="522" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">座位から立位、そして片足へ進みます</text>

    <rect x="40" y="56" width="720" height="108" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="125" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">座位</text>
    <text x="125" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">初級</text>
    <line x1="210" y1="70" x2="210" y2="150" stroke="#90CAF9" stroke-width="2"/>
    <text x="234" y="82" font-size="14" font-weight="bold" fill="#0F172A">座位かかと上げ／座位つま先上げ／足関節の底屈・背屈</text>
    <text x="234" y="108" font-size="12" font-weight="bold" fill="#475569">椅子に座ったまま安全にできます。最初に渡す形です</text>
    <text x="234" y="130" font-size="12" font-weight="bold" fill="#475569">足指のグーパー運動（10回×1セット）もここに入ります</text>
    <rect x="40" y="176" width="720" height="108" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="125" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">立位</text>
    <text x="125" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">中級</text>
    <line x1="210" y1="190" x2="210" y2="270" stroke="#90CAF9" stroke-width="2"/>
    <text x="234" y="202" font-size="14" font-weight="bold" fill="#0F172A">立位でのかかと上げ／立位でのつま先上げ</text>
    <text x="234" y="228" font-size="12" font-weight="bold" fill="#475569">立位バランスが必要です。ふらつく場合は必ず支持物を使います</text>
    <text x="234" y="250" font-size="12" font-weight="bold" fill="#475569">とくにつま先上げは後方へふらつきやすいので、支持物を先に決めます</text>
    <rect x="40" y="296" width="720" height="108" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="125" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">片足</text>
    <text x="125" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">上級</text>
    <line x1="210" y1="310" x2="210" y2="390" stroke="#CBD5E1" stroke-width="2"/>
    <text x="234" y="322" font-size="14" font-weight="bold" fill="#0F172A">片足ヒールライズ</text>
    <text x="234" y="348" font-size="12" font-weight="bold" fill="#475569">片足立ちが安定している方向け。壁やテーブルに軽く手を添えます</text>
    <text x="234" y="370" font-size="12" font-weight="bold" fill="#475569">ゆっくり上げてゆっくり下ろすことで効果が高まります</text>
    <rect x="40" y="424" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="453" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">難易度は素材の欄そのままです。自分で決めていません</text>
    <text x="400" y="504" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">アキレス腱のストレッチは、膝を伸ばすと腓腹筋・曲げるとヒラメ筋。各15〜30秒の保持です</text>
  </g>
</svg>
