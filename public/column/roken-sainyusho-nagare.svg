<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">この加算が動くのは、戻ってきたときだけ</text>

    <rect x="30" y="56" width="172" height="140" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="116" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">① 入所している</text>
    <text x="116" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">老健に入所中の方</text>
    <text x="116" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">ここが出発点です</text>

    <text x="216" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#94A3B8">→</text>

    <rect x="230" y="56" width="172" height="140" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="316" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">② 退所して入院</text>
    <text x="316" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">病院又は診療所に</text>
    <text x="316" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">入院すること</text>

    <text x="416" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#94A3B8">→</text>

    <rect x="430" y="56" width="172" height="140" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="516" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">③ 退院する</text>
    <text x="516" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">入院していた病院や</text>
    <text x="516" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">診療所を退院する</text>

    <text x="616" y="132" text-anchor="middle" font-size="20" font-weight="bold" fill="#94A3B8">→</text>

    <rect x="630" y="56" width="140" height="140" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="700" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">④ 再入所</text>
    <text x="700" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">200単位</text>
    <text x="700" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350F">1人につき1回まで</text>

    <rect x="40" y="216" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">戻ってきたときに、特別食等が必要になっていること</text>

    <text x="400" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">同じ老健に戻ることが条件です。別の施設に移った場合は当てはまりません</text>
  </g>
</svg>
