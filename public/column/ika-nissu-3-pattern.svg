<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">日数で変わるといっても、変わり方が3種類あります</text>

    <rect x="40" y="56" width="226" height="240" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="153" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">加算が減っていく</text>
    <text x="153" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">急性期（A100 注3）</text>
    <line x1="58" y1="126" x2="248" y2="126" stroke="#90CAF9" stroke-width="1"/>
    <text x="58" y="154" font-size="13" font-weight="bold" fill="#0F172A">14日以内</text>
    <text x="248" y="154" text-anchor="end" font-size="15" font-weight="bold" fill="#1565C0">450点/日</text>
    <text x="58" y="186" font-size="13" font-weight="bold" fill="#0F172A">15〜30日</text>
    <text x="248" y="186" text-anchor="end" font-size="15" font-weight="bold" fill="#1565C0">192点/日</text>
    <text x="58" y="218" font-size="13" font-weight="bold" fill="#0F172A">31日目〜</text>
    <text x="248" y="218" text-anchor="end" font-size="14" font-weight="bold" fill="#B45309">対象外</text>
    <text x="153" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">入院料はそのまま。</text>
    <text x="153" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">上に乗る加算だけが動く</text>

    <rect x="287" y="56" width="226" height="240" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">入院料が下がる</text>
    <text x="400" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">地域包括ケア（A308-3）</text>
    <line x1="305" y1="126" x2="495" y2="126" stroke="#90CAF9" stroke-width="1"/>
    <text x="305" y="154" font-size="13" font-weight="bold" fill="#0F172A">40日以内</text>
    <text x="495" y="154" text-anchor="end" font-size="15" font-weight="bold" fill="#1565C0">2,955点</text>
    <text x="305" y="186" font-size="13" font-weight="bold" fill="#0F172A">41日以上</text>
    <text x="495" y="186" text-anchor="end" font-size="15" font-weight="bold" fill="#1565C0">2,807点</text>
    <text x="305" y="218" font-size="13" font-weight="bold" fill="#0F172A">60日</text>
    <text x="495" y="218" text-anchor="end" font-size="14" font-weight="bold" fill="#B45309">ここが限度</text>
    <text x="400" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">点数は入院料1の例。</text>
    <text x="400" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">土台のほうが下がる</text>

    <rect x="534" y="56" width="226" height="240" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="647" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">算定できなくなる</text>
    <text x="647" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">回復期リハ（A308）</text>
    <line x1="552" y1="126" x2="742" y2="126" stroke="#90CAF9" stroke-width="1"/>
    <text x="647" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">状態ごとに上限日数</text>
    <text x="647" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">脳血管疾患等は</text>
    <text x="647" y="208" text-anchor="middle" font-size="17" font-weight="bold" fill="#1565C0">150日以内など</text>
    <text x="647" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">超えたら別の算定へ。</text>
    <text x="647" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">日数は状態で変わる</text>

    <rect x="40" y="316" width="720" height="44" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="344" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">「日数を過ぎる」の意味が3つとも違います。減る・下がる・使えなくなる</text>

    <text x="400" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">正確な点数と日数は、報酬チェックの各ページで確認できます</text>
  </g>
</svg>
