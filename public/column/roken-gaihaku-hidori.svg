<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <rect width="800" height="350" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">初日と最終日は算定しません（3泊4日の場合）</text>

    <rect x="40" y="60" width="172" height="130" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="126" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">1日目</text>
    <text x="126" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">出かける日</text>
    <text x="126" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#94A3B8">×</text>
    <text x="126" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748B">初日は算定しない</text>

    <rect x="222" y="60" width="172" height="130" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="308" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">2日目</text>
    <text x="308" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">まるまる外泊</text>
    <text x="308" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">362単位</text>
    <text x="308" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">算定できる</text>

    <rect x="404" y="60" width="172" height="130" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="490" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">3日目</text>
    <text x="490" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">まるまる外泊</text>
    <text x="490" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">362単位</text>
    <text x="490" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">算定できる</text>

    <rect x="586" y="60" width="172" height="130" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="672" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">4日目</text>
    <text x="672" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">帰ってくる日</text>
    <text x="672" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#94A3B8">×</text>
    <text x="672" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748B">最終日は算定しない</text>

    <rect x="40" y="212" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">3泊は4日にまたがるので、算定できるのは真ん中の2日です</text>

    <text x="400" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">1月に6日を限度。数えるのは、初日と最終日を除いたこの日数です</text>
    <text x="400" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">初日と最終日に何を算定するかは告示に書かれていません。原本と保険者への確認を優先してください</text>
  </g>
</svg>
