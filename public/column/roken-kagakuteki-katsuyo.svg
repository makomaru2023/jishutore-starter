<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">(Ⅰ)も(Ⅱ)も、要件は「活用すること」まで</text>

    <rect x="40" y="56" width="226" height="150" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="153" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">① 集める</text>
    <text x="153" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">入所者ごとのADL値</text>
    <text x="153" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">栄養・口腔・認知症など</text>
    <text x="153" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">心身の状況等の情報</text>

    <rect x="287" y="56" width="226" height="150" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">② 提出する</text>
    <text x="400" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">厚生労働省に</text>
    <text x="400" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">提出していること</text>
    <text x="400" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">（(Ⅱ)は疾病・服薬も）</text>

    <rect x="534" y="56" width="226" height="150" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="647" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">③ 活用する</text>
    <text x="647" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">必要に応じて</text>
    <text x="647" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">施設サービス計画の</text>
    <text x="647" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350F">見直しその他の提供に</text>

    <rect x="40" y="226" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">③まで書かれているので、出して終わりにはなりません</text>

    <text x="400" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">この形は、LIFEへの提出が要る加算に共通しています</text>
  </g>
</svg>
