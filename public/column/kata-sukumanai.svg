<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">種目が違っても、共通して書かれている注意があります</text>

    <rect x="40" y="56" width="345" height="216" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="212" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#0F172A">「肩がすくまないよう」</text>
    <text x="212" y="122" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565C0">6つの素材</text>
    <line x1="70" y1="140" x2="355" y2="140" stroke="#90CAF9" stroke-width="2"/>
    <text x="212" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">肩挙上運動</text>
    <text x="212" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">ダンベルを使った肩関節外転運動</text>
    <text x="212" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">肩甲骨の内転運動</text>
    <text x="212" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">肩回し（正面）／肩回し（側面）</text>
    <text x="212" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">両手組みバンザイ</text>

    <rect x="415" y="56" width="345" height="216" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="587" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#0F172A">「痛みが出る角度の手前で止める」</text>
    <text x="587" y="122" text-anchor="middle" font-size="26" font-weight="bold" fill="#1565C0">3つの素材</text>
    <line x1="445" y1="140" x2="730" y2="140" stroke="#CBD5E1" stroke-width="2"/>
    <text x="587" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">両手でタオルを把持して肩関節屈曲</text>
    <text x="587" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">棒を使用した肩関節屈曲</text>
    <text x="587" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">臥位で両肩の屈曲運動</text>
    <text x="587" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#B45309">どれも補助しながら上げる運動です</text>

    <rect x="40" y="288" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="317" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">イラストは動きの形を伝えるもの。力の入り方は、その場で見せたほうが早いです</text>

    <text x="400" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">当サイトの素材データ（プレビュー用の文字なし素材）を数えた結果です</text>
  </g>
</svg>
