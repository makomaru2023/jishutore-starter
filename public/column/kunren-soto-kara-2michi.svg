<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">事業所にリハビリ職がいなくても、外から借りる道が2つあります</text>

    <rect x="40" y="56" width="352" height="190" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">助言をもらう</text>
    <text x="216" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">訪問は要件ではありません</text>
    <line x1="72" y1="122" x2="360" y2="122" stroke="#90CAF9" stroke-width="2"/>
    <text x="216" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">100単位／月</text>
    <text x="216" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">外部の理学療法士等や医師の助言にもとづき</text>
    <text x="216" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">機能訓練指導員等が共同で評価・計画を作成</text>
    <text x="216" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">3月に1回を限度</text>

    <rect x="408" y="56" width="352" height="190" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">来てもらう</text>
    <text x="584" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">事業所を訪問してもらいます</text>
    <line x1="440" y1="122" x2="728" y2="122" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="152" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">200単位／月</text>
    <text x="584" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">外部の理学療法士等が事業所を訪問し</text>
    <text x="584" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">機能訓練指導員等と共同で評価・計画を作成</text>
    <text x="584" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">訪問そのものが要件</text>

    <rect x="40" y="266" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">どちらも3月ごとに1回以上、進み具合を評価して本人・家族に説明します</text>

    <text x="400" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">個別機能訓練加算を算定していると、助言だけの道は算定せず、来てもらう道は1月100単位になります</text>
  </g>
</svg>
