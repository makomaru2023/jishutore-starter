<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">急に増やしたいときは、保険のほうが切り替わります</text>

    <rect x="40" y="56" width="352" height="186" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">介護保険で見ていた方が</text>
    <text x="216" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">急性増悪などで頻回の訪問が要るとき</text>
    <line x1="72" y1="122" x2="360" y2="122" stroke="#FCD34D" stroke-width="2"/>
    <text x="216" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">主治医が計画的な医学的管理のもとで</text>
    <text x="216" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">特別の指示を行う</text>
    <text x="216" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">指示の日から14日間は医療保険へ</text>
    <text x="216" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">その14日間は訪問リハビリテーション費を算定しません</text>

    <rect x="408" y="56" width="352" height="186" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">医療保険の側にも枠があります</text>
    <text x="584" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">1月にバーセル指数かFIMが5点以上悪化</text>
    <line x1="440" y1="122" x2="728" y2="122" stroke="#90CAF9" stroke-width="2"/>
    <text x="584" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">6月に1回、診療の日から14日以内</text>
    <text x="584" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#0F172A">14日を限度として</text>
    <text x="584" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">1日4単位まで</text>
    <text x="584" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">週6単位の限度とは別に算定できます</text>

    <rect x="40" y="262" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="291" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">どちらも14日という区切りで動きます</text>

    <text x="400" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">実際の請求では、原本と保険者・地方厚生局への確認を優先してください</text>
  </g>
</svg>
