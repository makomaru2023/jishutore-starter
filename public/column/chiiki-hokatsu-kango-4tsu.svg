<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" width="800" height="474">
  <rect width="800" height="474" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">地域包括ケア病棟で別に取れる看護まわりの加算</text>

    <rect x="40" y="56" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="165" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">看護補助・患者ケア体制充実加算</text>
    <line x1="290" y1="70" x2="290" y2="126" stroke="#90CAF9" stroke-width="2"/>
    <text x="314" y="82" font-size="14" font-weight="bold" fill="#0F172A">加算1＝190点／加算2＝175点／加算3＝165点（1日につき）</text>
    <text x="314" y="108" font-size="11" font-weight="bold" fill="#475569">身体的拘束を実施した日は、区分にかかわらず加算3（165点）の例により算定します</text>
    <rect x="40" y="152" width="720" height="60" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="165" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">看護補助者配置加算</text>
    <line x1="290" y1="166" x2="290" y2="198" stroke="#FCD34D" stroke-width="2"/>
    <text x="314" y="178" font-size="14" font-weight="bold" fill="#0F172A">160点／日　★上の加算とは併せて算定できません</text>
    <rect x="40" y="224" width="720" height="60" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="165" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">看護職員配置加算</text>
    <line x1="290" y1="238" x2="290" y2="270" stroke="#CBD5E1" stroke-width="2"/>
    <text x="314" y="250" font-size="14" font-weight="bold" fill="#0F172A">150点／日</text>
    <rect x="40" y="296" width="720" height="60" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="165" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">看護職員夜間配置加算</text>
    <line x1="290" y1="310" x2="290" y2="342" stroke="#CBD5E1" stroke-width="2"/>
    <text x="314" y="322" font-size="14" font-weight="bold" fill="#0F172A">70点／日（別に厚生労働大臣が定める日を除く）</text>
    <rect x="40" y="376" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">拘束をした日は1日25点下がります。届出ではなく日々の実施の話です</text>
    <text x="400" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">いずれも施設基準に適合するものとして地方厚生局長等に届け出た病棟・病室が対象です</text>
  </g>
</svg>
