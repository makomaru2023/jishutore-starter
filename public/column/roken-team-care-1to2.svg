<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">150単位と120単位、差は研修の種類</text>

    <rect x="40" y="56" width="352" height="200" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">加算(Ⅰ)　150単位／月</text>
    <text x="216" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">配置する人の研修が上です</text>
    <line x1="72" y1="122" x2="360" y2="122" stroke="#FCD34D" stroke-width="2"/>
    <text x="216" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">予防等に資する認知症介護の指導に係る</text>
    <text x="216" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">専門的な研修を修了している者</text>
    <text x="216" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#94A3B8">（研修＋ケアプログラムの道もあります）</text>
    <text x="216" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">1名以上を配置</text>

    <rect x="408" y="56" width="352" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">加算(Ⅱ)　120単位／月</text>
    <text x="584" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">配置要件が一部ゆるみます</text>
    <line x1="440" y1="122" x2="728" y2="122" stroke="#90CAF9" stroke-width="2"/>
    <text x="584" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">予防等に資する認知症介護に係る</text>
    <text x="584" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">専門的な研修を修了している者</text>
    <text x="584" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#94A3B8">（「指導に係る」が付きません）</text>
    <text x="584" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">1名以上を配置</text>

    <rect x="40" y="276" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">どちらも、複数人の介護職員でチームを組みます</text>

    <text x="400" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">どちらも1月につき。認知症専門ケア加算を算定していると、この加算は算定しません</text>
  </g>
</svg>
