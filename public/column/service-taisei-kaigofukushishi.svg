<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">介護福祉士の割合は、老健のほうが高く求められます</text>

    <text x="110" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748B">区分</text>
    <rect x="180" y="50" width="290" height="26" rx="13" fill="#1565C0"/>
    <text x="325" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">老健・入所</text>
    <rect x="470" y="50" width="290" height="26" rx="13" fill="#64748B"/>
    <text x="615" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">通所介護・通所リハ</text>

    <rect x="40" y="84" width="720" height="76" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="110" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">(Ⅰ)</text>
    <text x="325" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#1565C0">80%以上</text>
    <text x="325" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">または勤続10年以上が35%以上</text>
    <text x="615" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#B45309">70%以上</text>
    <text x="615" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">または勤続10年以上が25%以上</text>

    <rect x="40" y="168" width="720" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="110" y="204" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">(Ⅱ)</text>
    <text x="325" y="204" text-anchor="middle" font-size="17" font-weight="bold" fill="#1565C0">60%以上</text>
    <text x="615" y="204" text-anchor="middle" font-size="17" font-weight="bold" fill="#B45309">50%以上</text>

    <rect x="40" y="236" width="720" height="76" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="110" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F172A">(Ⅲ)</text>
    <text x="325" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#1565C0">50%以上</text>
    <text x="325" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">ほかに常勤割合・勤続年数の道あり</text>
    <text x="615" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#B45309">40%以上</text>
    <text x="615" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">ほかに勤続7年以上30%の道あり</text>

    <rect x="40" y="330" width="720" height="44" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">どの区分でも老健のほうが10ポイント高い。通所の感覚で老健を見ないこと</text>
  </g>
</svg>
