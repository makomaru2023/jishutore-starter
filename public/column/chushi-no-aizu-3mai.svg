<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 382" width="800" height="382">
  <rect width="800" height="382" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">中止の合図は3枚。1枚を選んで渡します</text>

    <rect x="40" y="56" width="230" height="210" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="155" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">息切れ</text>
    <text x="155" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">呼吸器疾患のある方に</text>
    <line x1="60" y1="132" x2="250" y2="132" stroke="#90CAF9" stroke-width="2"/>
    <text x="155" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">息切れがあるときは運動中止</text>
    <text x="155" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">続く場合は医療機関の</text>
    <text x="155" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">受診も検討する</text>
    <rect x="285" y="56" width="230" height="210" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">頭痛</text>
    <text x="400" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">血圧の管理が要る方に</text>
    <line x1="305" y1="132" x2="495" y2="132" stroke="#90CAF9" stroke-width="2"/>
    <text x="400" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">頭痛があるときは運動中止</text>
    <text x="400" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">続く場合は医療機関の</text>
    <text x="400" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">受診も検討する</text>
    <rect x="530" y="56" width="230" height="210" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="645" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">胸の痛み</text>
    <text x="645" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">心疾患のある方に</text>
    <line x1="550" y1="132" x2="740" y2="132" stroke="#90CAF9" stroke-width="2"/>
    <text x="645" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">胸に痛みがあるときは運動中止</text>
    <text x="645" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">続く場合は医療機関の</text>
    <text x="645" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">受診も検討する</text>
    <rect x="40" y="284" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="313" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">3枚とも渡すと読まれません。起こりやすいものを1枚だけ選びます</text>
    <text x="400" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">注意書きが増えるほど読まれなくなる、というのが渡してみての実感です</text>
  </g>
</svg>
