<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" width="800" height="474">
  <rect width="800" height="474" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">入所した日から、締切が2つ動きます</text>

    <rect x="40" y="56" width="720" height="130" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="140" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">7日</text>
    <text x="140" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">居宅へ訪問する</text>
    <line x1="240" y1="70" x2="240" y2="172" stroke="#90CAF9" stroke-width="2"/>
    <text x="264" y="84" font-size="14" font-weight="bold" fill="#0F172A">入所予定日の前30日以内、または入所後7日以内</text>
    <text x="264" y="110" font-size="12" font-weight="bold" fill="#475569">退所後に生活する居宅を訪問します。入所中1回が限度です</text>
    <text x="264" y="132" font-size="12" font-weight="bold" fill="#475569">450単位＝退所を目的とした計画の策定と診療方針の決定</text>
    <text x="264" y="154" font-size="12" font-weight="bold" fill="#475569">480単位＝改善目標と退所後の生活に係る支援計画まで策定</text>

    <rect x="40" y="198" width="720" height="106" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="140" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">30日</text>
    <text x="140" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">上乗せがある</text>
    <line x1="240" y1="212" x2="240" y2="290" stroke="#CBD5E1" stroke-width="2"/>
    <text x="264" y="226" font-size="14" font-weight="bold" fill="#0F172A">入所日から起算して30日以内</text>
    <text x="264" y="252" font-size="12" font-weight="bold" fill="#475569">初期加算(Ⅰ)＝1日60単位／初期加算(Ⅱ)＝1日30単位</text>
    <text x="264" y="274" font-size="12" font-weight="bold" fill="#475569">どちらか一方だけを算定します</text>

    <rect x="40" y="322" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">7日も30日も、数え始めるのは同じ「入所日」です</text>

    <text x="400" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">入所してから動くと7日しかありません。連絡を受けた時点から動くのが安全です</text>
    <text x="400" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">居宅への訪問は、入所期間が1月を超えると見込まれる方が対象です</text>
  </g>
</svg>
