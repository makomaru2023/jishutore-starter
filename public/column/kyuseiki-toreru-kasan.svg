<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 498" width="800" height="498">
  <rect width="800" height="498" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">急性期一般病棟でも「何でも取れる」ではありません</text>

    <rect x="40" y="56" width="720" height="108" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="140" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">広く算定できる</text>
    <line x1="240" y1="70" x2="240" y2="150" stroke="#90CAF9" stroke-width="2"/>
    <text x="264" y="82" font-size="14" font-weight="bold" fill="#0F172A">入退院支援加算／排尿自立支援加算／認知症ケア加算</text>
    <text x="264" y="108" font-size="12" font-weight="bold" fill="#475569">急性期看護補助体制加算／看護職員夜間配置加算</text>
    <text x="264" y="130" font-size="12" font-weight="bold" fill="#475569">いずれも告示の注10に列挙された加算です</text>
    <rect x="40" y="176" width="720" height="108" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="140" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">入院基本料に限る</text>
    <line x1="240" y1="190" x2="240" y2="270" stroke="#FCD34D" stroke-width="2"/>
    <text x="264" y="202" font-size="14" font-weight="bold" fill="#0F172A">リハビリテーション・栄養・口腔連携体制加算</text>
    <text x="264" y="228" font-size="12" font-weight="bold" fill="#475569">術後疼痛管理チーム加算／せん妄ハイリスク患者ケア加算</text>
    <text x="264" y="250" font-size="12" font-weight="bold" fill="#475569">急性期病院一般入院基本料または急性期一般入院基本料に限られます</text>
    <rect x="40" y="296" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="140" y="344" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">90日を超えたら</text>
    <line x1="240" y1="310" x2="240" y2="366" stroke="#CBD5E1" stroke-width="2"/>
    <text x="264" y="322" font-size="14" font-weight="bold" fill="#0F172A">届出病棟では、療養病棟入院料1の例により算定します</text>
    <text x="264" y="348" font-size="12" font-weight="bold" fill="#475569">注1から注10の規定にかかわらず、という書き方になっています</text>
    <rect x="40" y="400" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="429" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">「急性期の病棟なら取れる」ではなく、どの入院基本料かまで見ます</text>
    <text x="400" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">算定できる加算は告示に列挙されています。報酬チェックの各ページで確認できます</text>
  </g>
</svg>
