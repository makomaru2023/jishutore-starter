<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">27単位と57単位、見ているものが違う</text>

    <rect x="40" y="56" width="352" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">加算(Ⅰ)　27単位／日</text>
    <text x="216" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">見るのは施設のほうです</text>
    <line x1="72" y1="122" x2="360" y2="122" stroke="#90CAF9" stroke-width="2"/>
    <text x="216" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">転換前が介護療養型医療施設か療養病床</text>
    <text x="216" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">介護職員が常勤換算で4又はその端数ごとに1</text>
    <text x="216" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">算定方法第13号の基準に該当しないこと</text>
    <text x="216" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">施設の来歴と、職員の数</text>

    <rect x="408" y="56" width="352" height="200" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">加算(Ⅱ)　57単位／日</text>
    <text x="584" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">見るのは入所者のほうです</text>
    <line x1="440" y1="122" x2="728" y2="122" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">前3月間、喀痰吸引又は経管栄養が20%以上</text>
    <text x="584" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">前3月間、専門医療を必要とする認知症高齢者</text>
    <text x="584" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">が50%以上</text>
    <text x="584" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">入所者の状態像の割合</text>

    <rect x="40" y="276" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">(Ⅱ)の2つには「いずれか」と書かれていません</text>

    <text x="400" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">どちらも1日につき。基本報酬のイ(2)(3)とロ(2)(3)について算定します</text>
  </g>
</svg>
