<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" width="800" height="396">
  <rect width="800" height="396" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">算定するために先にそろえる4つ</text>

    <!-- 1 -->
    <rect x="40" y="54" width="350" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="78" cy="94" r="18" fill="#1565C0"/>
    <text x="78" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="108" y="88" font-size="15" font-weight="bold" fill="#0F172A">都道府県知事への届出</text>
    <text x="108" y="112" font-size="15" font-weight="bold" fill="#0F172A">（電子情報処理組織を使う方法）</text>

    <!-- 2 -->
    <rect x="410" y="54" width="350" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="448" cy="94" r="18" fill="#1565C0"/>
    <text x="448" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="478" y="88" font-size="15" font-weight="bold" fill="#0F172A">事故発生防止の基準に</text>
    <text x="478" y="112" font-size="15" font-weight="bold" fill="#0F172A">適合していること</text>

    <!-- 3 -->
    <rect x="40" y="146" width="350" height="80" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <circle cx="78" cy="186" r="18" fill="#B45309"/>
    <text x="78" y="192" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="108" y="180" font-size="15" font-weight="bold" fill="#78350F">担当者が「外部」の研修を</text>
    <text x="108" y="204" font-size="15" font-weight="bold" fill="#78350F">受けていること</text>

    <!-- 4 -->
    <rect x="410" y="146" width="350" height="80" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="448" cy="186" r="18" fill="#1565C0"/>
    <text x="448" y="192" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="478" y="180" font-size="15" font-weight="bold" fill="#0F172A">施設内に安全管理部門を</text>
    <text x="478" y="204" font-size="15" font-weight="bold" fill="#0F172A">設置していること</text>

    <!-- 矢印 -->
    <path d="M400 236 v20" stroke="#94A3B8" stroke-width="2"/>
    <path d="M400 260 l-6 -10 h12 z" fill="#94A3B8"/>

    <!-- 結論 -->
    <rect x="40" y="268" width="720" height="60" rx="10" fill="#1565C0"/>
    <text x="400" y="305" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">4つそろって、入所初日に限り算定できる</text>

    <text x="400" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">一人あたりの単位数は小さいが、要件は「体制」。</text>
    <text x="400" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">一度整えれば、以後の入所すべてで算定できる。</text>
  </g>
</svg>
