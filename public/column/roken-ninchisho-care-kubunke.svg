<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">76単位を決めているのは「区分け」です</text>

    <rect x="40" y="56" width="352" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">だれが対象か</text>
    <line x1="72" y1="102" x2="360" y2="102" stroke="#90CAF9" stroke-width="2"/>
    <text x="216" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">日常生活に支障を来すおそれのある</text>
    <text x="216" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">症状又は行動が認められることから</text>
    <text x="216" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">介護を必要とする認知症の入所者</text>
    <text x="216" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">診断名だけでは決まりません</text>

    <rect x="408" y="56" width="352" height="200" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">どう分けるか</text>
    <line x1="440" y1="102" x2="728" y2="102" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">対象の入所者と他の入所者を区別する</text>
    <text x="584" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">原則として、同一の建物又は階に</text>
    <text x="584" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">他の入所者を入所させないこと</text>
    <text x="584" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">専らその入所者のための施設</text>

    <rect x="40" y="276" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">ケアの中身ではなく、場所の話が要件になっています</text>

    <text x="400" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">1日につき76単位。届出は電子情報処理組織を使用する方法で行います</text>
  </g>
</svg>
