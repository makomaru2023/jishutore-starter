<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" width="800" height="474">
  <rect width="800" height="474" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">指導者向けの素材は3つの種類に分かれます</text>

    <rect x="40" y="56" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="145" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">① 良い例と悪い例</text>
    <line x1="250" y1="70" x2="250" y2="126" stroke="#90CAF9" stroke-width="2"/>
    <text x="274" y="82" font-size="14" font-weight="bold" fill="#0F172A">プランクの良い例・悪い例</text>
    <text x="274" y="108" font-size="12" font-weight="bold" fill="#475569">正しいフォームのイメージを持たせる目的。そのまま渡せます</text>
    <rect x="40" y="152" width="720" height="108" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="145" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">② NG動作だけ</text>
    <line x1="250" y1="166" x2="250" y2="246" stroke="#FCD34D" stroke-width="2"/>
    <text x="274" y="178" font-size="12.5" font-weight="bold" fill="#0F172A">TKA術後の正座／しゃがみ込み／1段ずつの階段降り／低い椅子／靴ひもを結ぶ前屈</text>
    <text x="274" y="204" font-size="12" font-weight="bold" fill="#475569">避けたい動作を見せるもの。★代わりの方法とセットで渡します</text>
    <text x="274" y="226" font-size="12" font-weight="bold" fill="#475569">脊椎疾患の禁忌運動も、主治医の指示を確認したうえで使います</text>
    <rect x="40" y="272" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="145" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">③ 中止の合図</text>
    <line x1="250" y1="286" x2="250" y2="342" stroke="#CBD5E1" stroke-width="2"/>
    <text x="274" y="298" font-size="14" font-weight="bold" fill="#0F172A">息切れ／頭痛／胸の痛み　の3枚</text>
    <text x="274" y="324" font-size="12" font-weight="bold" fill="#475569">やめどきを伝えるもの。その方に起こりやすい1枚を選びます</text>
    <rect x="40" y="376" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">NG例だけを渡すと「ダメ出しの紙」になります</text>
    <text x="400" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">NG例の答えは「環境を変える」になっているものが多く、家族に見せる資料にもなります</text>
  </g>
</svg>
