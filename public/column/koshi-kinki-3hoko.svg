<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" width="800" height="386">
  <rect width="800" height="386" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">腰は「避ける方向」を3つで確認します</text>

    <rect x="40" y="56" width="230" height="190" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="155" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">過度な屈曲</text>
    <text x="155" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">深い前かがみ</text>
    <line x1="60" y1="132" x2="250" y2="132" stroke="#90CAF9" stroke-width="2"/>
    <text x="155" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">靴ひもを結ぶ動作が典型例</text>
    <text x="155" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">ソックスエイドなどの代替も</text>
    <text x="155" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">一緒に伝えます</text>
    <rect x="285" y="56" width="230" height="190" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">過度な伸展</text>
    <text x="400" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">大きく反らす</text>
    <line x1="305" y1="132" x2="495" y2="132" stroke="#90CAF9" stroke-width="2"/>
    <text x="400" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">腰に痛みが出ない範囲で</text>
    <text x="400" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">という注意が素材にも入っています</text>
    <rect x="530" y="56" width="230" height="190" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="645" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">過度な回旋</text>
    <text x="645" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">体をひねる</text>
    <line x1="550" y1="132" x2="740" y2="132" stroke="#90CAF9" stroke-width="2"/>
    <text x="645" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">可動範囲を狭くする</text>
    <text x="645" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">という調整のしかたがあります</text>
    <text x="400" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">腰椎圧迫骨折・脊椎固定術後・椎間板ヘルニア・脊柱管狭窄症で、禁忌の内容が変わります</text>
    <rect x="40" y="288" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="317" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">この3方向は「確認する枠」であって、判断そのものではありません</text>
    <text x="400" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">疾患や術式により禁忌内容が異なるため、主治医の指示を必ず確認したうえで使ってください</text>
  </g>
</svg>
