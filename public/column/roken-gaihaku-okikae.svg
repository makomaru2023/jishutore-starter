<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">外泊時費用は、上乗せではなく置き換えです</text>

    <rect x="40" y="56" width="352" height="180" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="216" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">ふだんの日</text>
    <line x1="72" y1="106" x2="360" y2="106" stroke="#CBD5E1" stroke-width="2"/>
    <text x="216" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">介護保健施設サービス費</text>
    <text x="216" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">703〜1,287単位</text>
    <text x="216" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">1日につき。17区分あり、要介護度でも変わります</text>
    <text x="216" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">これが所定単位数です</text>

    <rect x="408" y="56" width="352" height="180" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">外泊した日</text>
    <line x1="440" y1="106" x2="728" y2="106" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">外泊時費用</text>
    <text x="584" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#78350F">362単位</text>
    <text x="584" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">1日につき。1月に6日を限度とします</text>
    <text x="584" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">所定単位数に代えて算定します</text>

    <rect x="40" y="256" width="720" height="46" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">加算ではありません。いちばん低い区分の基本報酬より、さらに低くなります</text>

    <text x="400" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">実際の単位数は区分と要介護度で変わります。報酬チェックの基本報酬のページで確認できます</text>
  </g>
</svg>
