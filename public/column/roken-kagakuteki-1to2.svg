<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">40単位と60単位、差は出す情報の種類</text>

    <rect x="40" y="56" width="352" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">加算(Ⅰ)　40単位／月</text>
    <text x="216" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">基本的な情報を出します</text>
    <line x1="72" y1="122" x2="360" y2="122" stroke="#90CAF9" stroke-width="2"/>
    <text x="216" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">ADL値・栄養状態・口腔機能</text>
    <text x="216" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">認知症の状況</text>
    <text x="216" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">その他の心身の状況等</text>
    <text x="216" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">出して、活用する</text>

    <rect x="408" y="56" width="352" height="200" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">加算(Ⅱ)　60単位／月</text>
    <text x="584" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">(Ⅰ)の基本情報に「加えて」</text>
    <line x1="440" y1="122" x2="728" y2="122" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">＋ 疾病の状況</text>
    <text x="584" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">＋ 服薬の状況　等</text>
    <text x="584" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">これも出して、活用する</text>

    <rect x="40" y="276" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">(Ⅰ)と(Ⅱ)は、いずれか一方のみ算定します</text>

    <text x="400" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">どちらも1月につき。差の20単位は、疾病と服薬を足すかどうかでした</text>
  </g>
</svg>
