<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 546" width="800" height="546">
  <rect width="800" height="546" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">体幹の運動は、支える面積が減る順に並びます</text>

    <rect x="40" y="56" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="130" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">① 座位</text>
    <text x="130" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">初級</text>
    <line x1="220" y1="70" x2="220" y2="126" stroke="#90CAF9" stroke-width="2"/>
    <text x="244" y="82" font-size="14" font-weight="bold" fill="#0F172A">座位での体側倒し（10秒×3セット）／座位で腕を広げた体幹回旋</text>
    <text x="244" y="108" font-size="12" font-weight="bold" fill="#475569">お尻と足で支えるので、いちばん安定しています</text>
    <rect x="40" y="152" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="130" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">② 四つん這い</text>
    <text x="130" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">初級</text>
    <line x1="220" y1="166" x2="220" y2="222" stroke="#90CAF9" stroke-width="2"/>
    <text x="244" y="178" font-size="14" font-weight="bold" fill="#0F172A">パピーポジション（15〜30秒）</text>
    <text x="244" y="204" font-size="12" font-weight="bold" fill="#475569">両手と両膝の4点で支えます。腰が過度に反らないよう注意します</text>
    <rect x="40" y="248" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="130" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">③ 手足を上げる</text>
    <text x="130" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">中級</text>
    <line x1="220" y1="262" x2="220" y2="318" stroke="#CBD5E1" stroke-width="2"/>
    <text x="244" y="274" font-size="14" font-weight="bold" fill="#0F172A">四つん這いで体幹の回旋／ダイアゴナル</text>
    <text x="244" y="300" font-size="12" font-weight="bold" fill="#475569">支える点が減ります。ダイアゴナルは手だけ・脚だけから始められます</text>
    <rect x="40" y="344" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="130" y="392" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">④ プランク</text>
    <text x="130" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">入門〜中級</text>
    <line x1="220" y1="358" x2="220" y2="414" stroke="#CBD5E1" stroke-width="2"/>
    <text x="244" y="370" font-size="14" font-weight="bold" fill="#0F172A">膝をついてプランク（10〜15秒）→ プランク</text>
    <text x="244" y="396" font-size="12" font-weight="bold" fill="#475569">フォームが崩れたら終了。時間を伸ばすことより崩れないことが優先です</text>
    <rect x="40" y="448" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="477" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">姿勢の高さではなく、体を支えている面積で並んでいます</text>
    <text x="400" y="528" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">四つん這い姿勢の保持が困難な場合は、座位の2種目だけで組む選び方もできます</text>
  </g>
</svg>
