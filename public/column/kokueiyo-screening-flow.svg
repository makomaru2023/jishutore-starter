<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">やることは2つ。それを6か月ごとに繰り返します</text>

    <!-- タイムライン -->
    <line x1="110" y1="70" x2="690" y2="70" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="110" cy="70" r="9" fill="#1565C0"/>
    <circle cx="400" cy="70" r="9" fill="#1565C0"/>
    <circle cx="690" cy="70" r="9" fill="#1565C0"/>
    <text x="110" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">利用開始時</text>
    <text x="400" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">6か月後</text>
    <text x="690" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">12か月後</text>

    <!-- やること1 -->
    <rect x="40" y="126" width="350" height="124" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="74" cy="160" r="17" fill="#1565C0"/>
    <text x="74" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="102" y="167" font-size="17" font-weight="bold" fill="#0F172A">確認する</text>
    <text x="64" y="205" font-size="14" font-weight="bold" fill="#334155">口腔の健康状態</text>
    <text x="64" y="231" font-size="14" font-weight="bold" fill="#334155">栄養状態</text>

    <!-- 矢印 -->
    <polygon points="394,178 408,188 394,198" fill="#1565C0"/>

    <!-- やること2 -->
    <rect x="410" y="126" width="350" height="124" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <circle cx="444" cy="160" r="17" fill="#1565C0"/>
    <text x="444" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="472" y="167" font-size="17" font-weight="bold" fill="#0F172A">伝える</text>
    <text x="434" y="205" font-size="14" font-weight="bold" fill="#334155">確認した情報を</text>
    <text x="434" y="231" font-size="14" font-weight="bold" fill="#334155">担当の介護支援専門員へ提供する</text>

    <!-- 注意 -->
    <rect x="40" y="272" width="720" height="44" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">算定できるのは6月に1回まで。両方みるか一方だけかで区分が変わります</text>

    <text x="400" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">単位数と算定要件の全文は報酬チェックのページにまとめています</text>
  </g>
</svg>
