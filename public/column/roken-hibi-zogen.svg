<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" width="800" height="474">
  <rect width="800" height="474" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">老健で日ごとに動くお金は3つあります</text>

    <rect x="40" y="56" width="720" height="108" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="135" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">外泊時費用</text>
    <text x="135" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">日で置き換える</text>
    <line x1="230" y1="70" x2="230" y2="150" stroke="#90CAF9" stroke-width="2"/>
    <text x="254" y="82" font-size="14" font-weight="bold" fill="#0F172A">362単位/日　1月に6日を限度</text>
    <text x="254" y="108" font-size="12" font-weight="bold" fill="#475569">「所定単位数に代えて」算定するので、上乗せではなく置き換えです</text>
    <text x="254" y="130" font-size="12" font-weight="bold" fill="#475569">外泊の初日および最終日は算定しません</text>
    <rect x="40" y="176" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="135" y="224" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">室料相当額控除</text>
    <text x="135" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">日で引く</text>
    <line x1="230" y1="190" x2="230" y2="246" stroke="#CBD5E1" stroke-width="2"/>
    <text x="254" y="202" font-size="14" font-weight="bold" fill="#0F172A">−26単位/日　多床室の区分が対象</text>
    <text x="254" y="228" font-size="12" font-weight="bold" fill="#475569">施設基準に該当する施設だけ、所定単位数から差し引きます</text>
    <rect x="40" y="272" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="135" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">療養食加算</text>
    <text x="135" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">回で足す</text>
    <line x1="230" y1="286" x2="230" y2="342" stroke="#90CAF9" stroke-width="2"/>
    <text x="254" y="298" font-size="14" font-weight="bold" fill="#0F172A">6単位/回　1日3回を限度（1日あたり最大18単位）</text>
    <text x="254" y="324" font-size="12" font-weight="bold" fill="#475569">医師の発行する食事箋に基づいて提供された療養食が対象です</text>
    <rect x="40" y="376" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">日で置き換える・日で引く・回で足す。3つとも数え方が違います</text>
    <text x="400" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">3泊4日の外泊なら、算定の対象になるのは間の2日ということになります</text>
  </g>
</svg>
