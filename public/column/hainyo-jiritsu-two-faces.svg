<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">排尿自立支援加算は、回復期リハでは2つの働きをします</text>

    <!-- 加算として -->
    <rect x="40" y="54" width="350" height="250" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <rect x="60" y="72" width="126" height="28" rx="14" fill="#64748B"/>
    <text x="123" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">加算として</text>
    <text x="60" y="146" font-size="22" font-weight="bold" fill="#1565C0">週1回 200点</text>
    <text x="60" y="178" font-size="15" font-weight="bold" fill="#0F172A">12週が限度</text>
    <line x1="60" y1="200" x2="370" y2="200" stroke="#CBD5E1" stroke-width="1"/>
    <text x="60" y="230" font-size="13" font-weight="bold" fill="#334155">A308は原則として包括ですが、</text>
    <text x="60" y="254" font-size="13" font-weight="bold" fill="#334155">この加算は別に算定できます</text>

    <!-- 施設基準として -->
    <rect x="410" y="54" width="350" height="250" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <rect x="430" y="72" width="150" height="28" rx="14" fill="#1565C0"/>
    <text x="505" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">施設基準として</text>
    <text x="430" y="142" font-size="15" font-weight="bold" fill="#0F172A">回復期リハビリテーション</text>
    <text x="430" y="168" font-size="15" font-weight="bold" fill="#0F172A">強化体制加算（80点/日）の</text>
    <text x="430" y="194" font-size="15" font-weight="bold" fill="#0F172A">施設基準のひとつ</text>
    <line x1="430" y1="216" x2="740" y2="216" stroke="#90CAF9" stroke-width="1"/>
    <text x="430" y="246" font-size="13" font-weight="bold" fill="#334155">届出がないと、強化体制加算</text>
    <text x="430" y="270" font-size="13" font-weight="bold" fill="#334155">そのものが取れません</text>

    <!-- 対象 -->
    <rect x="40" y="322" width="720" height="48" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">対象は、施設基準に適合する保険医療機関で、算定できる入院料等を現に算定している患者</text>
  </g>
</svg>
