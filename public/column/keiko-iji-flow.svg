<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" width="800" height="486">
  <rect width="800" height="486" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">経口維持加算(Ⅰ)は、この順番で進みます</text>

    <!-- 上段 -->
    <rect x="40" y="52" width="220" height="165" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="70" cy="82" r="16" fill="#1565C0"/>
    <text x="70" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="58" y="132" font-size="14" font-weight="bold" fill="#0F172A">医師が摂食・嚥下</text>
    <text x="58" y="156" font-size="14" font-weight="bold" fill="#0F172A">機能を評価する</text>

    <polygon points="266,110 284,120 266,130" fill="#1565C0"/>

    <rect x="290" y="52" width="220" height="165" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="320" cy="82" r="16" fill="#1565C0"/>
    <text x="320" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="308" y="132" font-size="14" font-weight="bold" fill="#0F172A">口から食べていて、</text>
    <text x="308" y="156" font-size="14" font-weight="bold" fill="#0F172A">摂食機能障害があり、</text>
    <text x="308" y="180" font-size="14" font-weight="bold" fill="#0F172A">誤嚥が認められる方</text>

    <polygon points="516,110 534,120 516,130" fill="#1565C0"/>

    <rect x="540" y="52" width="220" height="165" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="570" cy="82" r="16" fill="#1565C0"/>
    <text x="570" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="558" y="132" font-size="14" font-weight="bold" fill="#0F172A">医師または歯科医師</text>
    <text x="558" y="156" font-size="14" font-weight="bold" fill="#0F172A">が指示を出す</text>

    <!-- 下段 -->
    <rect x="40" y="237" width="220" height="165" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="70" cy="267" r="16" fill="#1565C0"/>
    <text x="70" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="58" y="317" font-size="14" font-weight="bold" fill="#0F172A">多職種が集まって</text>
    <text x="58" y="341" font-size="14" font-weight="bold" fill="#0F172A">食事の観察と会議を</text>
    <text x="58" y="365" font-size="14" font-weight="bold" fill="#0F172A">行う</text>

    <polygon points="266,295 284,305 266,315" fill="#1565C0"/>

    <rect x="290" y="237" width="220" height="165" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="320" cy="267" r="16" fill="#1565C0"/>
    <text x="320" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="308" y="317" font-size="14" font-weight="bold" fill="#0F172A">入所者ごとに</text>
    <text x="308" y="341" font-size="14" font-weight="bold" fill="#0F172A">経口維持計画を作る</text>

    <polygon points="516,295 534,305 516,315" fill="#1565C0"/>

    <rect x="540" y="237" width="220" height="165" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="570" cy="267" r="16" fill="#1565C0"/>
    <text x="570" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">6</text>
    <text x="558" y="317" font-size="14" font-weight="bold" fill="#0F172A">指示を受けた</text>
    <text x="558" y="341" font-size="14" font-weight="bold" fill="#0F172A">管理栄養士または</text>
    <text x="558" y="365" font-size="14" font-weight="bold" fill="#0F172A">栄養士が栄養管理</text>

    <!-- 注意 -->
    <rect x="40" y="420" width="720" height="44" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="448" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">経口移行加算を算定している場合、経口維持加算(Ⅰ)は算定しない</text>
  </g>
</svg>
