<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">難しくするときは、種目ではなく物を変えます</text>

    <rect x="40" y="56" width="330" height="240" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="205" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#0F172A">種目を増やすやり方</text>
    <rect x="70" y="106" width="270" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="205" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">ペグ操作を渡す</text>
    <rect x="70" y="148" width="270" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="205" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">＋ 箸の練習も渡す</text>
    <rect x="70" y="190" width="270" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="205" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">＋ 洗濯ばさみも渡す</text>
    <text x="205" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">覚えることが増え、紙も厚くなります</text>
    <text x="205" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#B45309">結局どれもやらないことに</text>

    <rect x="430" y="56" width="330" height="240" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="595" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1565C0">物を変えるやり方</text>
    <text x="460" y="118" font-size="13" font-weight="bold" fill="#0F172A">ペグ操作</text>
    <text x="460" y="138" font-size="12" font-weight="bold" fill="#475569">ペグの大きさや形状を変える</text>
    <text x="460" y="166" font-size="13" font-weight="bold" fill="#0F172A">お手玉を使った箸練習</text>
    <text x="460" y="186" font-size="12" font-weight="bold" fill="#475569">つかみやすい大きさから小さい物へ</text>
    <text x="460" y="214" font-size="13" font-weight="bold" fill="#0F172A">硬貨を使った運動</text>
    <text x="460" y="234" font-size="12" font-weight="bold" fill="#475569">片手で複数を操作する課題へ</text>
    <text x="460" y="262" font-size="13" font-weight="bold" fill="#0F172A">洗濯ばさみつまみ</text>
    <text x="460" y="282" font-size="12" font-weight="bold" fill="#475569">つまむ指や取り付ける位置を変える</text>

    <rect x="40" y="312" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="341" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">種目が変わらなければ、渡す紙は同じままで済みます</text>

    <text x="400" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">難易度の調整のしかたは、それぞれの素材の説明に書いてあります</text>
  </g>
</svg>
