<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424">
  <rect width="800" height="424" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">委員会で検討することが、決められています</text>

    <rect x="40" y="56" width="720" height="42" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="140" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">安全とケアの質</text>
    <line x1="260" y1="66" x2="260" y2="88" stroke="#90CAF9" stroke-width="2"/>
    <text x="284" y="83" font-size="13" font-weight="bold" fill="#0F172A">介護機器を使うときの安全と、ケアの質</text>

    <rect x="40" y="106" width="720" height="42" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="140" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">職員の負担</text>
    <line x1="260" y1="116" x2="260" y2="138" stroke="#90CAF9" stroke-width="2"/>
    <text x="284" y="133" font-size="13" font-weight="bold" fill="#0F172A">負担の軽減と、勤務状況への配慮</text>

    <rect x="40" y="156" width="720" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="140" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">定期点検</text>
    <line x1="260" y1="166" x2="260" y2="188" stroke="#CBD5E1" stroke-width="2"/>
    <text x="284" y="183" font-size="13" font-weight="bold" fill="#0F172A">介護機器の定期点検</text>

    <rect x="40" y="206" width="720" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="140" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">職員研修</text>
    <line x1="260" y1="216" x2="260" y2="238" stroke="#CBD5E1" stroke-width="2"/>
    <text x="284" y="233" font-size="13" font-weight="bold" fill="#0F172A">業務効率化・質向上・負担軽減のための研修</text>

    <rect x="40" y="256" width="720" height="42" rx="8" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="140" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">業務分担</text>
    <line x1="260" y1="266" x2="260" y2="288" stroke="#FCD34D" stroke-width="2"/>
    <text x="284" y="283" font-size="13" font-weight="bold" fill="#0F172A">職員の業務分担の明確化等による業務効率化</text>

    <rect x="40" y="318" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350F">検討して終わりではなく、実施を定期的に確認することまで求められます</text>

    <text x="400" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">10単位のほうも、この委員会の要件は同じです</text>
  </g>
</svg>
