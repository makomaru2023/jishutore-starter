<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">伸びを、かかった日数で割った数字です</text>

    <rect x="40" y="56" width="720" height="84" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="150" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">分子</text>
    <text x="150" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">どれだけ良くなったか</text>
    <line x1="270" y1="70" x2="270" y2="126" stroke="#90CAF9" stroke-width="2"/>
    <text x="294" y="84" font-size="14" font-weight="bold" fill="#0F172A">退棟時のFIM運動項目 − 入棟時のFIM運動項目</text>
    <text x="294" y="110" font-size="12" font-weight="bold" fill="#475569">歩行・車椅子とトイレ動作は、条件を満たすと1点加わります</text>

    <rect x="40" y="152" width="720" height="84" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="150" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">分母</text>
    <text x="150" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">どれだけかかったか</text>
    <line x1="270" y1="166" x2="270" y2="222" stroke="#CBD5E1" stroke-width="2"/>
    <text x="294" y="180" font-size="14" font-weight="bold" fill="#0F172A">入棟から退棟までの日数 ÷ その方の算定日数上限</text>
    <text x="294" y="206" font-size="12" font-weight="bold" fill="#475569">入棟時の状態によって、上限の日数が変わります</text>

    <rect x="40" y="248" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">同じだけ良くなっても、日数がかかると数字は下がります</text>

    <text x="400" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">分子の総和を分母の総和で割ります。対象は前月までの6か月間に退棟した患者さんです</text>
    <text x="400" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">算出は各年度の4月・7月・10月・1月。今日の関わりが数字に出るのは退棟してからです</text>
    <text x="400" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">在棟中に一度も回復期リハ病棟入院料等を算定しなかった方と、亡くなった方は対象外です</text>
  </g>
</svg>
