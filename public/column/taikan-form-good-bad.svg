<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" width="800" height="362">
  <rect width="800" height="362" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">プランクの崩れ方は2つに集まります</text>

    <rect x="40" y="56" width="230" height="190" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="155" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">良い例</text>
    <text x="155" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">目指す形</text>
    <text x="155" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">頭からかかとまで一直線</text>
    <line x1="60" y1="156" x2="250" y2="156" stroke="#90CAF9" stroke-width="2"/>
    <text x="155" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">肘と膝を床につき</text>
    <text x="155" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">一直線を保ちます</text>
    <rect x="285" y="56" width="230" height="190" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">悪い例 その1</text>
    <text x="400" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">よくある崩れ</text>
    <text x="400" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">お尻が上がる</text>
    <line x1="305" y1="156" x2="495" y2="156" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">体が「く」の字になり</text>
    <text x="400" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">体幹に力が入りません</text>
    <rect x="530" y="56" width="230" height="190" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="645" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">悪い例 その2</text>
    <text x="645" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">よくある崩れ</text>
    <text x="645" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">腰が反る</text>
    <line x1="550" y1="156" x2="740" y2="156" stroke="#FCD34D" stroke-width="2"/>
    <text x="645" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">腰に負担がかかります</text>
    <text x="645" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">この形なら終了の合図です</text>
    <rect x="40" y="264" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="293" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">素材庫には、良い例と悪い例を並べた1枚があります</text>
    <text x="400" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">自分の姿勢は自分では見えません。渡すときに1度だけ、鏡か写真で確認してもらいます</text>
  </g>
</svg>
