<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">特別の指示が出ると、14日間だけ入れ替わります</text>

    <rect x="40" y="86" width="220" height="88" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="150" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">介護保険</text>
    <text x="150" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">訪問リハビリテーション費</text>

    <rect x="290" y="86" width="220" height="88" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">医療保険</text>
    <text x="400" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350F">指示の日から14日間が限度</text>

    <rect x="540" y="86" width="220" height="88" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="650" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">介護保険</text>
    <text x="650" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">訪問リハビリテーション費</text>

    <path d="M262 130 L286 130" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M512 130 L536 130" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
      </marker>
    </defs>

    <text x="275" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">特別の指示</text>
    <text x="525" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">14日経過</text>

    <rect x="290" y="196" width="220" height="72" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">保険医療機関の医師が</text>
    <text x="400" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">急性増悪等を認めて</text>
    <text x="400" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">特別の指示を行った場合</text>

    <rect x="40" y="290" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="319" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">この14日間は、介護保険の訪問リハビリテーション費を算定しません</text>

    <text x="400" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">重ねて取れるのではなく、入れ替わります。原則は介護保険が優先です</text>
  </g>
</svg>
