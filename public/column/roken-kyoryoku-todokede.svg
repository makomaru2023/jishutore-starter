<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">3つ目だけ、相手が病院に限られます</text>

    <rect x="40" y="56" width="226" height="150" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="153" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">① 相談対応</text>
    <text x="153" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">病状が急変した場合等に</text>
    <text x="153" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">医師又は看護職員が</text>
    <text x="153" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">相談対応を行う体制</text>
    <text x="153" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">常時確保</text>

    <rect x="287" y="56" width="226" height="150" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">② 診療</text>
    <text x="400" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">老健から診療の求めが</text>
    <text x="400" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">あった場合に診療を</text>
    <text x="400" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">行う体制</text>
    <text x="400" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">常時確保</text>

    <rect x="534" y="56" width="226" height="150" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="647" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">③ 入院の受入</text>
    <text x="647" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">入院を要すると認められた</text>
    <text x="647" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">入所者の入院を原則として</text>
    <text x="647" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">受け入れる体制</text>
    <text x="647" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">★病院に限られます</text>

    <rect x="40" y="226" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">1年に1回以上、急変時の対応を確認して届け出ます</text>

    <text x="400" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">協力医療機関の名称等を都道府県知事に届け出ることも要件に入っています</text>
  </g>
</svg>
