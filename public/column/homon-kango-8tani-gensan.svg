<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">どちらかに当たると、1回につき8単位が引かれます</text>

    <rect x="40" y="56" width="350" height="200" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <rect x="60" y="74" width="52" height="28" rx="14" fill="#B45309"/>
    <text x="86" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">イ</text>
    <text x="60" y="134" font-size="14" font-weight="bold" fill="#78350F">前年度、リハ職の訪問回数が</text>
    <text x="60" y="160" font-size="14" font-weight="bold" fill="#78350F">看護職員の訪問回数を</text>
    <text x="60" y="186" font-size="17" font-weight="bold" fill="#B45309">超えている</text>
    <text x="60" y="224" font-size="12" font-weight="bold" fill="#92400E">＝リハ職の動きがそのまま効く</text>

    <rect x="410" y="56" width="350" height="200" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <rect x="430" y="74" width="52" height="28" rx="14" fill="#B45309"/>
    <text x="456" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ロ</text>
    <text x="430" y="130" font-size="14" font-weight="bold" fill="#78350F">緊急時訪問看護加算</text>
    <text x="430" y="154" font-size="14" font-weight="bold" fill="#78350F">特別管理加算</text>
    <text x="430" y="178" font-size="14" font-weight="bold" fill="#78350F">看護体制強化加算</text>
    <text x="430" y="204" font-size="16" font-weight="bold" fill="#B45309">この3つをどれも算定していない</text>
    <text x="430" y="236" font-size="12" font-weight="bold" fill="#92400E">＝事業所の体制が効く</text>

    <rect x="40" y="276" width="720" height="48" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">対象はリハ職の訪問だけ。看護職員による訪問看護には適用されません</text>

    <text x="400" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">正確な要件は、報酬チェックの「理学療法士等による訪問看護の減算」で確認できます</text>
  </g>
</svg>
