<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372">
  <rect width="800" height="372" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">50単位と5単位、決めるのは相手の体制</text>

    <rect x="40" y="56" width="352" height="200" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">50単位／月</text>
    <text x="216" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">相手が3つの体制を持っている</text>
    <line x1="72" y1="122" x2="360" y2="122" stroke="#FCD34D" stroke-width="2"/>
    <text x="216" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">急変時に相談対応を行う体制を常時確保</text>
    <text x="216" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">求めがあれば診療を行う体制を常時確保</text>
    <text x="216" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">入院を原則として受け入れる体制を確保</text>
    <text x="216" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">3つとも満たす協力医療機関</text>

    <rect x="408" y="56" width="352" height="200" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">5単位／月</text>
    <text x="584" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">それ以外の協力医療機関</text>
    <line x1="440" y1="122" x2="728" y2="122" stroke="#90CAF9" stroke-width="2"/>
    <text x="584" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">入所者の同意を得て、病歴等の情報を</text>
    <text x="584" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">共有する会議を定期的に開催すること</text>
    <text x="584" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#94A3B8">（この会議は50単位でも要ります）</text>
    <text x="584" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">会議は、どちらでも共通です</text>

    <rect x="40" y="276" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">施設が努力しても、相手が変わらないと10倍にはなりません</text>

    <text x="400" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">どちらも1月につき。会議は入所者の同意を得たうえで開きます</text>
  </g>
</svg>
