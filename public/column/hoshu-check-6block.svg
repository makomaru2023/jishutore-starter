<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" width="800" height="452">
  <rect width="800" height="452" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">1ページは、6つのかたまりでできています</text>

    <rect x="40" y="56" width="720" height="40" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="165" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">単位数・点数</text>
    <line x1="290" y1="64" x2="290" y2="88" stroke="#90CAF9" stroke-width="2"/>
    <text x="314" y="81" font-size="13" font-weight="bold" fill="#0F172A">いくらになるか</text>

    <rect x="40" y="102" width="720" height="40" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="165" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">算定要件</text>
    <line x1="290" y1="110" x2="290" y2="134" stroke="#90CAF9" stroke-width="2"/>
    <text x="314" y="127" font-size="13" font-weight="bold" fill="#0F172A">そもそも取れるかどうか</text>

    <rect x="40" y="148" width="720" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="165" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">記録に残すこと</text>
    <line x1="290" y1="156" x2="290" y2="180" stroke="#CBD5E1" stroke-width="2"/>
    <text x="314" y="173" font-size="13" font-weight="bold" fill="#0F172A">何を書き残しておくか</text>

    <rect x="40" y="194" width="720" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="165" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">自己点検で見るポイント</text>
    <line x1="290" y1="202" x2="290" y2="226" stroke="#CBD5E1" stroke-width="2"/>
    <text x="314" y="219" font-size="13" font-weight="bold" fill="#0F172A">抜けているところがないか</text>

    <rect x="40" y="240" width="720" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="165" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">つまずきやすい点</text>
    <line x1="290" y1="248" x2="290" y2="272" stroke="#CBD5E1" stroke-width="2"/>
    <text x="314" y="265" font-size="13" font-weight="bold" fill="#0F172A">どこで落ちやすいか</text>

    <rect x="40" y="286" width="720" height="40" rx="8" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="165" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">根拠資料</text>
    <line x1="290" y1="294" x2="290" y2="318" stroke="#FCD34D" stroke-width="2"/>
    <text x="314" y="311" font-size="13" font-weight="bold" fill="#0F172A">元の資料はどこか、いつ確認したか</text>

    <rect x="40" y="346" width="720" height="46" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="400" y="375" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350F">6つとも読む必要はありません。目的のかたまりだけで足ります</text>

    <text x="400" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">下の3つは会員向けの欄です。全文公開サンプルの項目では誰でも読めます</text>
  </g>
</svg>
