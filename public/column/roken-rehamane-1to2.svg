<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#FFFFFF"/>
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">

    <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">33単位と53単位、分かれ目はここ</text>

    <rect x="40" y="56" width="352" height="210" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="216" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">加算(Ⅱ)　33単位／月</text>
    <text x="216" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">リハビリの中で完結します</text>
    <line x1="72" y1="122" x2="360" y2="122" stroke="#90CAF9" stroke-width="2"/>
    <text x="216" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">計画書の内容等の情報を厚生労働省に提出</text>
    <text x="216" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">必要に応じて計画の見直し等に活用</text>
    <text x="216" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">要件はこの2つだけです</text>

    <rect x="408" y="56" width="352" height="210" rx="10" fill="#FFF8E1" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">加算(Ⅰ)　53単位／月</text>
    <text x="584" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350F">同じ提出・活用に、4つ足されます</text>
    <line x1="440" y1="122" x2="728" y2="122" stroke="#FCD34D" stroke-width="2"/>
    <text x="584" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">① 口腔衛生管理加算(Ⅱ)を算定していること</text>
    <text x="584" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">② 栄養マネジメント強化加算を算定していること</text>
    <text x="584" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">③ リハ・口腔・栄養の情報を多職種で共有</text>
    <text x="584" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F172A">④ 共有を踏まえて計画を見直し、内容も共有</text>

    <rect x="40" y="286" width="720" height="46" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">(Ⅰ)と(Ⅱ)は、いずれか一方のみ算定します</text>

    <text x="400" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#64748B">どちらも1月につきの単位数です。届出は電子情報処理組織を使用する方法で行います</text>
  </g>
</svg>
